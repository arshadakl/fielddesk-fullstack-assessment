name: CI

on:
  pull_request:
  push:
    branches: [main, assessment/arshadakl]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fielddesk:ci_password@localhost:5432/fielddesk
      TEST_DATABASE_URL: postgresql://fielddesk:ci_password@localhost:5432/fielddesk_test
      TEST_REDIS_URL: redis://localhost:6379/15
      NEXT_PUBLIC_API_URL: http://localhost:3001
      E2E_DATABASE_URL: postgresql://fielddesk:ci_password@localhost:5432/fielddesk_web_test
      E2E_REDIS_URL: redis://localhost:6379/14
    services:
      redis:
        image: redis:7.4.11-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: fielddesk
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: fielddesk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fielddesk -d fielddesk"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:test:setup
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm --filter @fielddesk/web exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-test-results
          path: apps/web/test-results/
          retention-days: 7
